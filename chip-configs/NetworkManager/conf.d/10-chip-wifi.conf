# NetworkManager tuning for the CHIP's rtl8723bs (r8723bs) wifi. See
# docs/wifi-rtl8723bs.md.
[device]
# NM tries to randomize the MAC on every scan and per-connection; the driver
# rejects runtime MAC changes ("set-hw-addr: ... not successfully set (scanning)")
# and NM retries, adding seconds per rescan. This hardware can't do MAC
# randomization -- stop asking.
wifi.scan-rand-mac-address=no

[connection]
# NM defaults to randomized MAC per new profile. Same driver issue -- pin to the
# permanent hw address so profile creation doesn't hit the same retry cost.
wifi.cloned-mac-address=permanent

# The r8723bs driver's own power-save is disabled in /etc/modprobe.d/r8723bs.conf.
# NM's default (=3, enable) would re-enable 802.11 power-save over nl80211 after
# association, which the driver maps back onto LPS -- re-introducing idle
# disconnects. 2 = disable.
wifi.powersave=2
