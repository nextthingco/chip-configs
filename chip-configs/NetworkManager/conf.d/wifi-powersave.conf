# The r8723bs driver's own power-save is disabled in /etc/modprobe.d/r8723bs.conf.
# NetworkManager's default (wifi.powersave=3) would re-enable 802.11 power-save over
# nl80211 after association, which the driver maps back onto LPS -- re-introducing the
# idle disconnects we just disabled. 2 = disable. See docs/wifi-rtl8723bs.md.
[connection]
wifi.powersave = 2
