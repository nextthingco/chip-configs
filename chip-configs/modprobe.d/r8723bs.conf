# The onboard rtl8723bs SDIO wifi (module: r8723bs) is unstable with its firmware
# power-save enabled. LPS (rtw_power_mgnt) and especially IPS (rtw_ips_mode -- powers
# the RF down when idle and back up at scan/connect) gate the SDIO clock mid-transfer,
# producing storms of:
#     sunxi-mmc 1c0f000.mmc: data error, sending stop command
#     r8723bs ... sd_recv_rxfifo: alloc recvbuf FAIL!
# which stall RX, exhaust the recv-buffer pool, and break association. Disabling both
# fixes it (verified on-device). Not a memory or SDIO-clock problem -- see
# docs/wifi-rtl8723bs.md. Pairs with the NetworkManager wifi.powersave=2 drop-in.
options r8723bs rtw_power_mgnt=0 rtw_ips_mode=0
