# The onboard rtl8723bs SDIO wifi (module: r8723bs) needs three non-default knobs.
# See docs/wifi-rtl8723bs.md for the full investigation; short version:
#
# rtw_power_mgnt=0, rtw_ips_mode=0 -- disable firmware power-save. LPS and especially
#   IPS (powers the RF down when idle, back on at scan/connect) gate the SDIO clock
#   mid-transfer, producing "sunxi-mmc data error, sending stop command" and
#   "sd_recv_rxfifo: alloc recvbuf FAIL" storms that stall RX and break association.
#
# rtw_wifi_spec=1 -- strict 802.11 spec compliance in association-request formation
#   (IE ordering, capability advertisement, timing). Default =0 is loose and works
#   against most consumer APs, but stricter enterprise/mesh AP firmware rejects it
#   with an immediate "ASSOC_REJECT status_code=1 (unspecified failure)" -- clean
#   RSN/CCMP negotiation, permanent MAC, dmesg clean, still rejected. =1 makes the
#   assoc request conformant and the mesh accepts it. Verified on-device against an
#   eero/Plume-class mesh where every other client-side variable (PMF, FT, WPS,
#   MAC-rand, HT/11n, regdom, power-save) had already been ruled out.
#
# Pairs with the NetworkManager wifi.powersave=2 drop-in.
options r8723bs rtw_power_mgnt=0 rtw_ips_mode=0 rtw_wifi_spec=1
