# The CHIP power button: don't let logind power off on a short press. Where a
# window manager is running it owns the key (e.g. pocketchip's awesome binds it
# to "home" / raise pocket-home); on a flavor with no WM binding a tap simply
# does nothing. Either way, holding the button several seconds still
# hard-powers-off via the AXP209 PMIC in hardware, independent of logind.
#
# Shipped in chip-configs (all flavors, incl. headless) by deliberate choice, so a
# headless unit also won't gracefully shut down on a tap -- use `poweroff` over
# SSH or the hardware long-press.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
